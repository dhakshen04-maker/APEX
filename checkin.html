<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>APEX Attendance Check-in</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#eaf3ed;background:#0b120f}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0,#183025 0,#0b120f 48%)}.card{width:min(460px,100%);padding:28px;border:1px solid #294236;border-radius:22px;background:#101a15;box-shadow:0 24px 80px #0008}.brand{font-weight:800;letter-spacing:.18em;font-size:13px}.eyebrow{color:#86a494;font-size:10px;letter-spacing:.16em;margin:22px 0 7px}h1{font-size:28px;margin:0 0 8px}p{color:#93a39a;line-height:1.55;font-size:13px}.class{display:flex;justify-content:space-between;padding:14px;border:1px solid #294236;border-radius:14px;margin:18px 0}.class strong{font-size:18px}label{display:grid;gap:7px;color:#aab9b0;font-size:11px;margin-top:14px}input{width:100%;padding:13px 14px;border-radius:11px;border:1px solid #31473b;background:#0b120f;color:#fff;outline:none}button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:11px;background:#dcefe2;color:#0b120f;font-weight:800;cursor:pointer}.status{display:none;margin-top:18px;padding:14px;border-radius:12px;background:#14271c;color:#a8d4b5;font-size:13px}.error{background:#2a1717;color:#f0aaaa}.qr{display:none;margin:20px auto 0;padding:16px;background:#fff;width:272px;justify-content:center;border-radius:16px}.qr>div{width:240px;height:240px}.small{font-size:10px;color:#68786f;text-align:center;margin-top:16px}
</style>
</head>
<body><main class="card"><div class="brand">APEX</div><div class="eyebrow">ATTENDANCE CHECK-IN</div><h1>Check in to class</h1><p>This temporary session was created by your teacher.</p><div class="class"><span>Class</span><strong id="className">—</strong></div><form id="form"><label>Student name<input id="name" required autocomplete="name" placeholder="Enter your full name"></label><label>Roll number / Student ID<input id="roll" required placeholder="e.g. 23CSE001"></label><button type="submit">Create check-in QR</button></form><div class="status" id="status"></div><div class="qr" id="qr"><div id="qrcode"></div></div><p id="help" style="display:none;text-align:center">Show this QR to your teacher. APEX will validate your class, roll number, and session before marking you present.</p><div class="small">APEX · Temporary attendance session</div></main>
<script>
const p=new URLSearchParams(location.search);const cls=p.get('class')||'';const session=p.get('session')||'';const expires=Number(p.get('expires')||0);document.getElementById('className').textContent=cls||'Unknown class';const form=document.getElementById('form');const status=document.getElementById('status');const qr=document.getElementById('qr');const help=document.getElementById('help');if(!cls||!session||!expires||Date.now()>expires){form.style.display='none';status.style.display='block';status.className='status error';status.textContent='This attendance session has expired. Ask your teacher to start a new QR session.';}
form.addEventListener('submit',e=>{e.preventDefault();if(Date.now()>expires){location.reload();return}const name=document.getElementById('name').value.trim();const roll=document.getElementById('roll').value.trim();if(!name||!roll)return;const payload='APEX_CHECKIN|'+JSON.stringify({version:1,classId:cls,sessionId:session,name,roll,expiresAt:expires});form.style.display='none';status.style.display='block';status.textContent='Check-in QR ready ✓';qr.style.display='flex';help.style.display='block';new QRCode(document.getElementById('qrcode'),{text:payload,width:240,height:240,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});});
</script></body></html>
